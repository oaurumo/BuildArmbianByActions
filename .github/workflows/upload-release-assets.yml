name: Download and Upload Assets to Existing Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag name (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read and download urls.txt
        run: |
          mkdir downloads
          while IFS= read -r url || [ -n "$url" ]; do
            if [ -z "$url" ]; then continue; fi
            filename=$(basename "$url")
            echo "Downloading $url -> downloads/$filename"
            curl -L -o "downloads/$filename" "$url"
          done < urls.txt

      - name: Get Release upload_url
        id: get_release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ github.event.inputs.tag_name }}";
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tag
            });
            core.setOutput("upload_url", release.data.upload_url);

      - name: Upload assets to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: downloads/${{ matrix.file }}
          asset_name: ${{ matrix.file }}
          asset_content_type: application/octet-stream
        strategy:
          matrix:
            file: ${{ steps.list_files.outputs.files }}

      - name: List downloaded files
        id: list_files
        run: |
          cd downloads
          files=$(ls | jq -R -s -c 'split("\n")[:-1]')
          echo "files=$files" >> $GITHUB_OUTPUT
